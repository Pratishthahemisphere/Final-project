seed: 42

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  checkpoint_dir: "outputs/checkpoints"
  plots_dir: "outputs/plots"
  logs_dir: "outputs/logs"

data:
  img_size: 224
  batch_size: 32
  num_workers: null # auto-determined: 0 on Windows, 4 on Linux/macOS
  val_split: 0.15
  test_split: 0.15
  sampler: "none" # "none" (uses class-weighted loss) or "weighted" (uses WeightedRandomSampler)

model:
  backbone: "resnet50"
  pretrained: true
  attention: "cbam"
  dropout: 0.3
  num_classes: 2

train:
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.05
  patience: 7
  amp: true
  freeze_backbone_epochs: 3

inference:
  uncertainty_threshold: 0.70
